<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <div class="container mt-12 pt-12">
      <div class="row">
        <div class="col-md-10 m-auto">
          <h2 class="text-center mt-4">Convert Dollar to Egyptian Pound</h2>
          <form
            action="index.html"
            class="myForm"
            onsubmit="return convertValue();"
          >
            <input
              id="dollar"
              type="text"
              class="form-control mt-8"
              placeholder="Enter Amount of Dollars"
            />
            <input
              type="submit"
              value="convert"
              class="btn-solid theme-accent mt-4"
            />
          </form>

          <h5 id="result"></h5>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <script src="main.js"></script>
  </body>
</html>
